<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Leaf Standard · Users</title>
<link rel="stylesheet" href="static/style.css">
<style>
  .chk { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-weight: normal; }
  .chk input { width: auto; margin: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 12px; margin: 6px 0; }
  .rowbtns { display: flex; gap: 6px; flex-wrap: wrap; }
  .rowbtns button { padding: 4px 8px; font-size: 12px; }
</style>
</head>
<body>
<header class="top">
  <h1>Leaf Standard — Users<small>Admin</small></h1>
  <a class="btn ghost" href="./" style="border-color:rgba(255,255,255,.6);color:#fff;padding:6px 10px">Entry</a>
  <a class="btn ghost" href="dashboard" style="border-color:rgba(255,255,255,.6);color:#fff;padding:6px 10px">Dashboard</a>
  <a class="btn ghost" href="qrcodes" style="border-color:rgba(255,255,255,.6);color:#fff;padding:6px 10px">QR Codes</a>
  <button id="btnOut" class="ghost">Logout</button>
</header>
<main class="wrap">
  <div id="gate"></div>
  <section id="body" class="hidden">
    <div class="card">
      <h2 id="fTitle">Add user</h2>
      <form id="f">
        <input type="hidden" id="uid">
        <div class="row">
          <div><label>Username</label><input id="un" required autocapitalize="none"></div>
          <div><label>Full name</label><input id="fn"></div>
          <div><label>Role</label><select id="rl"><option value="estate">Estate</option><option value="ceo">CEO</option><option value="admin">Admin</option></select></div>
          <div id="esBox"><label>Estate</label><select id="es"></select></div>
          <div><label>Password <span class="muted" id="pwHint"></span></label><input id="pw" type="password" autocomplete="new-password"></div>
          <div style="flex:0 0 auto"><label>Active</label><input id="ac" type="checkbox" checked style="width:auto;height:38px"></div>
        </div>

        <div id="facBox" class="hidden" style="margin-top:8px">
          <label class="chk"><input type="checkbox" id="hf"> Has factory (can submit its own readings)</label>
          <p class="muted" style="margin:2px 0 10px;max-width:460px">
            Without a factory this login can still sign in and view its own past readings, read-only —
            another estate's factory enters the data for it (tick it below, in that estate's own access list).
          </p>
        </div>
        <div id="supplyBox" class="hidden" style="margin-bottom:10px">
          <label>Also enters readings for (besides its own estate)</label>
          <div id="supplyGrid" class="grid"></div>
        </div>

        <div id="fm"></div>
        <div class="row" style="margin-top:10px"><button style="flex:0 0 auto">Save</button><button type="button" class="ghost" id="clr" style="flex:0 0 auto">Clear</button></div>
      </form>
    </div>
    <div class="card"><h2>Users</h2><div class="tablewrap"><table class="ls" id="tb"></table></div></div>
  </section>
</main>
<script src="static/common.js"></script>
<script>
const $ = id => document.getElementById(id);
let estates = [], users = [], access = { estates: [], supply: {} };
$('btnOut').onclick = LS.logout;

$('rl').onchange = () => {
  const isEstate = $('rl').value === 'estate';
  $('esBox').classList.toggle('hidden', !isEstate);
  $('facBox').classList.toggle('hidden', !isEstate);
  $('supplyBox').classList.toggle('hidden', !isEstate || !$('hf').checked);
};
$('hf').onchange = () => $('supplyBox').classList.toggle('hidden', $('rl').value !== 'estate' || !$('hf').checked);
$('es').onchange = () => syncFactoryFields(+$('es').value);
$('clr').onclick = clear;

function syncFactoryFields(eid) {
  const e = estates.find(x => x.id === eid);
  $('hf').checked = !!(e && e.has_factory);
  renderSupplyGrid(eid);
  $('rl').onchange();
}

function renderSupplyGrid(eid) {
  const sel = new Set(access.supply[eid] || []);
  $('supplyGrid').innerHTML = estates.map(e => `
    <label class="chk"><input type="checkbox" value="${e.id}" ${e.id === eid ? 'checked disabled' : (sel.has(e.id) ? 'checked' : '')}>
      ${LS.esc(e.name)}</label>`).join('');
}

function clear() {
  $('f').reset(); $('uid').value = ''; $('un').disabled = false; $('fTitle').textContent = 'Add user';
  $('pwHint').textContent = ''; $('fm').innerHTML = '';
  if (estates.length) syncFactoryFields(+$('es').value); else $('rl').onchange();
}

// CHANGED: fetch the QR PNG through LS.api() (sends the Authorization
// header) and open it as a blob: URL, instead of a plain <img src> /
// <a href> which cannot carry a Bearer token and gets "Login required".
async function openQr(uid) {
  try {
    const res = await LS.api(`users/${uid}/qr.png`);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) { alert(e.message); }
}

async function load() {
  users = await LS.api('users');
  const en = Object.fromEntries(estates.map(e => [e.id, e.name]));
  $('tb').innerHTML = '<thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Estate</th><th>Access</th><th>Active</th><th></th></tr></thead><tbody>' +
    users.map(u => {
      const e = estates.find(x => x.id === u.estate_id);
      const acc = u.role !== 'estate' ? '' : (e && e.has_factory ? 'Submits' : 'View only');
      // CHANGED: both are now <button>s wired to JS handlers, not a raw <a>/<img>
      const qrBtns = u.role === 'estate' ? `
        <button class="ghost" data-view="${u.id}">QR</button>
        <button class="ghost" data-qr="${u.id}">New QR</button>` : '';
      return `<tr><td>${LS.esc(u.username)}</td><td>${LS.esc(u.full_name)}</td><td>${u.role}</td>
        <td>${LS.esc(en[u.estate_id] || '')}</td><td>${acc}</td>
        <td>${u.active ? '✓' : '✗'}</td>
        <td><div class="rowbtns"><button class="ghost" data-id="${u.id}">Edit</button>${qrBtns}</div></td></tr>`;
    }).join('') + '</tbody>';
  $('tb').querySelectorAll('button[data-id]').forEach(b => b.onclick = () => {
    const u = users.find(x => x.id == b.dataset.id);
    $('uid').value = u.id; $('un').value = u.username; $('un').disabled = true; $('fn').value = u.full_name;
    $('rl').value = u.role; $('es').value = u.estate_id || ''; $('ac').checked = u.active; $('pw').value = '';
    $('pwHint').textContent = '(blank = keep)'; $('fTitle').textContent = 'Edit ' + u.username;
    if (u.role === 'estate' && u.estate_id) syncFactoryFields(u.estate_id); else $('rl').onchange();
    scrollTo({ top: 0, behavior: 'smooth' });
  });
  // CHANGED: view QR
  $('tb').querySelectorAll('button[data-view]').forEach(b => b.onclick = () => openQr(b.dataset.view));
  // CHANGED: regenerate then view the new QR (both through LS.api())
  $('tb').querySelectorAll('button[data-qr]').forEach(b => b.onclick = async () => {
    if (!confirm('This invalidates the old printed QR code - it will stop working. Continue?')) return;
    try {
      await LS.api(`users/${b.dataset.qr}/qr/regenerate`, { method: 'POST' });
      await openQr(b.dataset.qr);
    } catch (e) { alert(e.message); }
  });
}

$('f').onsubmit = async ev => {
  ev.preventDefault();
  const id = $('uid').value;
  const role = $('rl').value;
  const estateId = role === 'estate' ? +$('es').value : null;
  const body = { username: $('un').value, full_name: $('fn').value, role, active: $('ac').checked,
    estate_id: estateId, password: $('pw').value || null };
  try {
    await LS.api(id ? `users/${id}` : 'users', { method: id ? 'PUT' : 'POST', body: JSON.stringify(body) });
    if (role === 'estate' && estateId) {
      await LS.api(`estates/${estateId}/factory`, { method: 'PUT', body: JSON.stringify({ has_factory: $('hf').checked }) });
      if ($('hf').checked) {
        const ids = [...$('supplyGrid').querySelectorAll('input:checked:not(:disabled)')].map(b => +b.value);
        await LS.api(`estates/${estateId}/supply`, { method: 'PUT', body: JSON.stringify({ estate_ids: ids }) });
      }
    }
    access = await LS.api('access'); estates = access.estates.filter(e => e.active);
    clear(); $('fm').innerHTML = '<div class="msg ok">Saved</div>'; load();
  } catch (e) { $('fm').innerHTML = `<div class="msg err">${LS.esc(e.message)}</div>`; }
};

(async () => {
  try {
    const me = await LS.api('me');
    if (me.role !== 'admin') throw new Error('Admin only');
    access = await LS.api('access'); estates = access.estates.filter(e => e.active);
    $('es').innerHTML = estates.map(e => `<option value="${e.id}">${LS.esc(e.name)}</option>`).join('');
    $('body').classList.remove('hidden');
    if (estates.length) syncFactoryFields(estates[0].id); else $('rl').onchange();
    load();
  } catch (e) { $('gate').innerHTML = `<div class="msg err">${LS.esc(e.message)} – <a href="./">login</a></div>`; }
})();
</script>
</body>
</html>
