<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#2e6b3a">
<title>Leaf Standard · Field Diary</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="static/style.css">
<!-- Styling for the per-factory breakdown shown on read-only (and
     multi-factory) session cards -->
<style>
  .breakdown { margin-top: 6px; }
  .breakdown table.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
  .breakdown table.mini td { padding: 3px 6px 3px 0; border-top: 1px solid rgba(0,0,0,.08); }
  .breakdown table.mini td:last-child { text-align: right; font-weight: 600; white-space: nowrap; }
  .breakdown .combined { margin-top: 4px; font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <h1><span data-t="title">Leaf Standard</span><small id="who" data-t="sub">Field Diary · daily 3-round entry</small></h1>
  <div class="lang"><button data-l="en">EN</button><button data-l="si">සිං</button><button data-l="ta">தமி</button></div>
  <a id="lnkDash" class="btn ghost hidden" href="dashboard" style="border-color:rgba(255,255,255,.6);color:#fff;padding:6px 10px" data-t="dashboard">CEO dashboard</a>
  <a id="lnkAdmin" class="btn ghost hidden" href="admin" style="border-color:rgba(255,255,255,.6);color:#fff;padding:6px 10px" data-t="admin">Users</a>
  <button id="btnOut" class="ghost hidden" data-t="logout">Logout</button>
</header>

<main class="wrap narrow">
  <!-- login -->
  <section id="loginCard" class="card hidden">
    <h2 data-t="login">Login</h2>
    <form id="loginForm">
      <label data-t="username">Username</label><input id="u" autocomplete="username" autocapitalize="none" required>
      <label data-t="password">Password</label><input id="p" type="password" autocomplete="current-password" required>
      <div id="loginMsg"></div>
      <button style="width:100%;margin-top:12px" data-t="login">Login</button>
    </form>
    <!-- Google Sign-In (shown only when LS_GOOGLE_CLIENT_ID is set and Google's script loads) -->
    <div id="gBox" class="hidden">
      <div class="muted" style="text-align:center;margin:14px 0 8px">— or —</div>
      <div class="gbtn" style="display:flex;justify-content:center"></div>
    </div>
  </section>

  <!-- who is entering data (Google, once per phone, after the estate QR login) -->
  <section id="whoCard" class="card hidden">
    <h2 data-t="whoTitle">Who is entering data?</h2>
    <p class="muted" data-t="whoSub">Sign in with Google once on this phone. Your name is saved with every reading you enter.</p>
    <div id="whoMsg"></div>
    <div id="whoBox" class="hidden"><div class="gbtn" style="display:flex;justify-content:center;margin-top:8px"></div></div>
  </section>

  <!-- entry -->
  <section id="entry" class="hidden">
    <div class="card">
      <div id="personBar" class="hidden" style="display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:14px">
        <span>👤 <b id="personName"></b> <span class="muted" id="personEmail"></span></span>
        <button type="button" class="ghost" id="swPerson" style="padding:3px 8px;font-size:12px;margin-left:auto" data-t="notYou">Not you?</button>
      </div>
      <div class="row">
        <div id="estateBox" class="hidden"><label data-t="estate">Estate</label><select id="estateSel"></select></div>
        <div><label data-t="date">Date</label><input id="dt" type="date"></div>
      </div>
      <div id="netMsg"></div>
    </div>
    <div id="sessions" class="sessions"></div>
    <div class="card" style="margin-top:14px">
      <h2 data-t="last7">Last 7 days</h2>
      <div class="tablewrap"><table class="ls hist" id="hist"></table></div>
    </div>
  </section>
</main>

<script src="static/common.js"></script>
<script>
const S = ['morning', 'noon', 'evening'];
const $ = id => document.getElementById(id);
let lastHist = [];
// current[session] is an ARRAY of readings (one per submitting factory),
// not a single reading object — more than one factory can submit for the
// same estate/date/session.
let user = null, cfg = null, estates = [], current = {}, mode = {};
// readOnly is true for an estate login whose estate has no factory - it
// can sign in and see its own history (with per-factory breakdown), but
// cannot submit readings.
let readOnly = false;

const queue = {
  all() { try { return JSON.parse(LS.store.get('queue') || '[]'); } catch (e) { return []; } },
  save(q) { LS.store.set('queue', JSON.stringify(q)); },
  add(item) { const q = this.all().filter(i => !(i.reading_date === item.reading_date && i.session === item.session && (i.estate_id || null) === (item.estate_id || null))); q.push(item); this.save(q); },
};

function msg(el, text, kind) { $(el).innerHTML = text ? `<div class="msg ${kind}">${LS.esc(text)}</div>` : ''; }

async function boot() {
  LS.setLang(LS.lang);
  document.querySelectorAll('.lang button').forEach(b => b.onclick = () => { LS.setLang(b.dataset.l); if (user) { renderSessions(); renderHistory(lastHist); } });
  $('btnOut').onclick = LS.logout;
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  try { cfg = await LS.api('config'); LS.store.set('cfg', JSON.stringify(cfg)); }
  catch (e) { cfg = JSON.parse(LS.store.get('cfg') || 'null') || { edit_days: 1, today: LS.iso(new Date()) }; }

  // QR auto-login — validate a saved session before exchanging the QR token,
  // since the QR exchange returns an estate-only token without Google identity.
  const qrToken = new URLSearchParams(location.search).get('token');
  let sessionChecked = false;
  if (qrToken) {
    history.replaceState({}, '', location.pathname);
    const savedToken = LS.store.get('token');
    if (savedToken) {
      try {
        user = await LS.api('me');
        LS.store.set('user', JSON.stringify(user));
      } catch (e) {
        if (e.status === 401) user = null;
      }
      sessionChecked = true;
    }
    if (!savedToken || !LS.store.get('token')) {
      try {
        const r = await LS.api(`qr-login?token=${encodeURIComponent(qrToken)}`);
        LS.store.set('token', r.token); LS.store.set('user', JSON.stringify(r.user)); user = r.user;
      } catch (e) {
        msg('loginMsg', 'This QR code is invalid or has been revoked. Please log in manually.', 'err');
      }
    }
  }

  user = user || JSON.parse(LS.store.get('user') || 'null');
  if (LS.store.get('token') && navigator.onLine && !sessionChecked) {
    try { user = await LS.api('me'); LS.store.set('user', JSON.stringify(user)); } catch (e) { if (e.status === 401) user = null; }
  }
  if (user) showEntry();
  else { $('loginCard').classList.remove('hidden'); initGoogle(); }
}

// Google Sign-In: returning users with a saved session never reach here -
// boot() opens their page directly. This only runs on the login screen.
function initGoogle() {
  LS.googleButton($('gBox'), cfg && cfg.google_client_id, u => {
    user = u;
    if (u.role === 'ceo') { location.href = 'dashboard'; return; }
    msg('loginMsg', ''); $('loginCard').classList.add('hidden'); showEntry();
  }, e => { if (e.status) msg('loginMsg', e.message, 'err'); });   // no status = Google script offline; password login still works
}

$('loginForm').onsubmit = async ev => {
  ev.preventDefault(); msg('loginMsg', '');
  try {
    const r = await LS.api('login', { method: 'POST', body: JSON.stringify({ username: $('u').value, password: $('p').value }), noRedirect: true });
    LS.store.set('token', r.token); LS.store.set('user', JSON.stringify(r.user)); user = r.user;
    if (user.role === 'ceo') { location.href = 'dashboard'; return; }
    $('loginCard').classList.add('hidden'); showEntry();
  } catch (e) { msg('loginMsg', e.message, 'err'); }
};

// Estate logins that can submit must say WHO is entering (Google, once per
// phone). Read-only estates (no factory) and admin skip this step.
function needsPerson() {
  return user.role === 'estate' && user.has_factory !== false && !user.person;
}

function askPerson() {
  $('entry').classList.add('hidden'); $('whoCard').classList.remove('hidden'); $('btnOut').classList.remove('hidden');
  $('who').textContent = `${user.full_name || user.username}${user.estate ? ' · ' + user.estate : ''}`;
  msg('whoMsg', '');
  if (!cfg.google_client_id) { msg('whoMsg', 'Google sign-in is not set up yet - contact admin.', 'err'); return; }
  if (!navigator.onLine) { msg('whoMsg', 'Connect to the internet once to sign in with Google.', 'info'); }
  LS.googleButton($('whoBox'), cfg.google_client_id, u => {
    user = u; msg('whoMsg', '');
    $('whoCard').classList.add('hidden'); showEntry();
  }, e => msg('whoMsg', e.message, 'err'), 'identify');
}

// "Not you?" - forget the person on this phone (the estate QR login stays)
async function switchPerson() {
  LS.googleForget();
  try {
    const r = await LS.api('forget-person', { method: 'POST' });
    LS.store.set('token', r.token); user = r.user;
  } catch (e) { user.person = null; }
  LS.store.set('user', JSON.stringify(user));
  askPerson();
}

let entryWired = false;
async function showEntry() {
  if (user.role === 'ceo') { location.href = 'dashboard'; return; }
  if (needsPerson()) { askPerson(); return; }
  $('entry').classList.remove('hidden'); $('btnOut').classList.remove('hidden');
  if (user.role === 'admin') { $('lnkDash').classList.remove('hidden'); $('lnkAdmin').classList.remove('hidden'); }
  $('who').textContent = `${user.full_name || user.username}${user.estate ? ' · ' + user.estate : ''}`;
  $('personBar').classList.toggle('hidden', !user.person);
  if (user.person) {
    $('personName').textContent = user.person.name;
    $('personEmail').textContent = `(${user.person.email})`;
    $('swPerson').onclick = switchPerson;
  }
  $('dt').max = cfg.today; $('dt').value = cfg.today;

  // Estates without a factory log in fine but get a read-only view - they
  // can see history (with per-factory breakdown) but the entry form is
  // hidden (see renderSessions below).
  readOnly = user.role === 'estate' && user.has_factory === false;
  if (readOnly) {
    msg('netMsg', 'Your estate has no factory, so readings are entered on your behalf by another estate. You can view your history below (read-only).', 'info');
  }

  if (user.role === 'admin') {
    $('lnkDash').classList.remove('hidden');
    estates = await LS.api('estates');
    $('estateBox').classList.remove('hidden');
    $('estateSel').innerHTML = estates.map(e => `<option value="${e.id}">${LS.esc(e.name)} (${e.region})</option>`).join('');
    $('estateSel').onchange = load;
  } else if (!readOnly) {
    $('dt').min = LS.addDays(cfg.today, -cfg.edit_days);
    // Factory users may be authorized to submit for more than one estate
    estates = await LS.api('my-estates');
    if (estates.length > 1) {
      $('estateBox').classList.remove('hidden');
      $('estateSel').innerHTML = estates.map((e, i) => `<option value="${e.id}" ${i === 0 ? 'selected' : ''}>${LS.esc(e.name)}</option>`).join('');
      $('estateSel').onchange = load;
    }
  }
  // Read-only estates skip my-estates entirely (it would return empty
  // anyway) and just view their own estate's history below.
  $('dt').onchange = load;
  if (!entryWired) { window.addEventListener('online', sync); entryWired = true; }
  await sync(); await load();
}

function estateId() {
  return (estates.length > 1 || user.role === 'admin') ? +$('estateSel').value : user.estate_id;
}

async function load() {
  const d = $('dt').value;
  current = {};
  try {
    const q = (user.role === 'admin' || estates.length > 1) ? `&estate_id=${estateId()}` : '';
    const rows = await LS.api(`readings?date=${cfg.today}&days=7${q}`);
    LS.store.set('hist_' + estateId(), JSON.stringify(rows));
    renderHistory(rows);
    // Push into an array per session instead of overwriting, so multiple
    // factories' entries for the same session all survive.
    if (d !== cfg.today || !rows.length) {
      const one = await LS.api(`readings?date=${d}&days=1${q}`);
      one.forEach(r => (current[r.session] ||= []).push(r));
    } else rows.filter(r => r.reading_date === d).forEach(r => (current[r.session] ||= []).push(r));
  } catch (e) {
    const rows = JSON.parse(LS.store.get('hist_' + estateId()) || '[]');
    renderHistory(rows);
    rows.filter(r => r.reading_date === d).forEach(r => (current[r.session] ||= []).push(r));
  }
  renderSessions();
}

function renderSessions() {
  const d = $('dt').value;
  const locked = user.role !== 'admin' && d < LS.addDays(cfg.today, -cfg.edit_days);
  const q = queue.all().filter(i => i.reading_date === d && (i.estate_id || user.estate_id) === estateId());
  $('sessions').innerHTML = S.map(s => {
    const entries = current[s] || [];
    // "mine" = the entry (if any) this logged-in user submitted for this
    // estate/date/session. The form below only ever edits this user's
    // own entry — never someone else's.
    const mine = entries.find(x => x.submitted_by === user.id);
    const r = mine;
    const pend = q.find(i => i.session === s);
    const m = 'p';
    const hasAny = entries.length > 0;

    // Status: a read-only login has no "mine" entry at all, but the
    // session still counts as submitted if ANY factory entered it.
    const status = pend
      ? `<span class="pill queued">${LS.t('queued')}</span>`
      : readOnly
        ? (hasAny ? `<span class="pill done">✓ ${LS.t('submitted')}</span>` : `<span class="pill todo">${LS.t('pending')}</span>`)
        : (r ? `<span class="pill done">✓ ${LS.t('submitted')} ${new Date(r.updated_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>` : `<span class="pill todo">${LS.t('pending')}</span>`);

    const combinedAvg = entries.length ? entries.reduce((a, e) => a + e.percent, 0) / entries.length : null;
    // The big headline number is my own entry when I have one, otherwise
    // (read-only) the combined average across whoever entered it.
    const val = pend ? (pend.percent ?? (pend.sample_good_g / pend.sample_total_g * 100))
      : r ? r.percent
      : readOnly ? combinedAvg
      : null;

    // Per-factory breakdown — who entered what. Shown whenever more than
    // one factory contributed, or the viewer is read-only (so they can
    // always see which factory entered even a single reading).
    const showBreakdown = hasAny && (entries.length > 1 || readOnly);
    const breakdown = showBreakdown ? `<div class="breakdown">
        <table class="mini"><tbody>${entries.map(e => {
          const label = e.submitted_by === user.id ? (LS.t('you') || 'You') : LS.esc(e.submitted_by_name || 'Unknown');
          return `<tr><td>${label}</td><td>${e.percent.toFixed(1)}%</td></tr>`;
        }).join('')}</tbody></table>
        ${entries.length > 1 ? `<div class="combined muted">${LS.t('combined') || 'Combined avg'}: <b>${combinedAvg.toFixed(1)}%</b></div>` : ''}
      </div>` : '';

    return `<div class="sess" data-s="${s}">
      <div class="head"><b>${LS.t(s)}</b>${status}</div>
      ${val != null ? `<div class="big">${(+val).toFixed(1)}%</div>` : ''}
      ${!pend && r && r.entered_by_name ? `<div class="muted" style="font-size:13px">${LS.t('by')} ${LS.esc(r.entered_by_name)}</div>` : ''}
      ${breakdown}
      ${locked ? `<p class="muted">🔒 ${LS.t('locked')}</p>` : readOnly ? '' : `
      <div class="${m === 'p' ? '' : 'hidden'}"><label>${LS.t('pct')}</label><input class="pc" type="number" inputmode="decimal" min="0" max="100" step="0.1" value="${r && m === 'p' ? r.percent : ''}" placeholder="e.g. 68.5"></div>
      <div class="row ${m === 'w' ? '' : 'hidden'}">
        <div><label>${LS.t('good')}</label><input class="gd" type="number" inputmode="decimal" min="0" step="0.1" value="${r?.sample_good_g ?? ''}"></div>
        <div><label>${LS.t('total')}</label><input class="tt" type="number" inputmode="decimal" min="0" step="0.1" value="${r?.sample_total_g ?? ''}"></div>
      </div>
      <div class="calc"></div>
      <label>${LS.t('remarks')}</label><input class="rm" maxlength="500" value="${LS.esc(r?.remarks || '')}">
      <div class="m"></div>
      <button type="button" class="sv" style="width:100%;margin-top:10px">${LS.t(r ? 'update' : 'save')}</button>`}
    </div>`;
  }).join('');
  document.querySelectorAll('.sess').forEach(card => {
    const s = card.dataset.s;
    card.querySelectorAll('.toggle button').forEach(b => b.onclick = () => { mode[s] = b.dataset.m; renderSessions(); });
    const gd = card.querySelector('.gd'), tt = card.querySelector('.tt'), calc = card.querySelector('.calc');
    const upd = () => { if (gd && tt && +tt.value > 0 && gd.value !== '') calc.textContent = `= ${(gd.value / tt.value * 100).toFixed(1)}%`; else if (calc) calc.textContent = ''; };
    gd && (gd.oninput = upd, tt.oninput = upd, upd());
    const sv = card.querySelector('.sv');
    if (sv) sv.onclick = () => save(card, s);
  });
}

async function save(card, s) {
  const m = 'p';
  const box = card.querySelector('.m');
  const body = { reading_date: $('dt').value, session: s, remarks: card.querySelector('.rm').value };
  if (user.role === 'admin' || estates.length > 1) body.estate_id = estateId();
  if (m === 'p') {
    const v = card.querySelector('.pc').value;
    if (v === '' || +v < 0 || +v > 100) { box.innerHTML = '<div class="msg err">0 – 100</div>'; return; }
    body.percent = +v;
  } else {
    const g = card.querySelector('.gd').value, t = card.querySelector('.tt').value;
    if (g === '' || !(+t > 0) || +g > +t) { box.innerHTML = '<div class="msg err">Good ≤ Total, Total &gt; 0</div>'; return; }
    body.sample_good_g = +g; body.sample_total_g = +t;
  }
  const btn = card.querySelector('.sv'); btn.disabled = true;
  try {
    const r = await LS.api('readings', { method: 'POST', body: JSON.stringify(body) });
    // Replace just this user's own entry within the array for this
    // session, rather than overwriting the whole session's value.
    const list = (current[s] || []).filter(x => x.submitted_by !== r.submitted_by);
    list.push(r);
    current[s] = list;
    await load();
    msg('netMsg', `${LS.t(s)} – ${LS.t('saved')} ${r.percent.toFixed(1)}%`, 'ok');
  } catch (e) {
    /* server answered with an error -> show it; no answer -> offline queue */
    if (e.status === 428) { user.person = null; LS.store.set('user', JSON.stringify(user)); askPerson(); return; }
    if (e.status) { box.innerHTML = `<div class="msg err">${LS.esc(e.message)}</div>`; btn.disabled = false; return; }
    queue.add(body); msg('netMsg', LS.t('offline'), 'info'); renderSessions();
  }
}

async function sync() {
  const q = queue.all();
  if (!q.length || !navigator.onLine) return;
  try {
    const r = await LS.api('readings/bulk', { method: 'POST', body: JSON.stringify({ items: q }) });
    const failed = r.results.filter(x => !x.ok);
    queue.save([]);
    msg('netMsg', failed.length ? `${q.length - failed.length} sent, ${failed.length} rejected: ${failed.map(f => f.error).join('; ')}` : `${LS.t('synced')} (${q.length})`, failed.length ? 'err' : 'ok');
    if ($('dt').value) load();
  } catch (e) { /* still offline */ }
}

function renderHistory(rows) {
  lastHist = rows;
  // Collect an ARRAY of leaf_standard values per date/session (multiple
  // factories can contribute to the same slot), then average each slot
  // when rendering — instead of the last one silently overwriting.
  const by = {};
  rows.forEach(r => {
    const day = (by[r.reading_date] ||= {});
    (day[r.session] ||= []).push(r.leaf_standard);
  });
  const avgOf = arr => (arr && arr.length) ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
  const days = Object.keys(by).sort().reverse();
  const tg = cfg.target || 0.7, wn = cfg.warn || 0.6;
  $('hist').innerHTML = `<thead><tr><th>${LS.t('date')}</th>${S.map(s => `<th>${LS.t(s)}</th>`).join('')}<th>${LS.t('dayavg')}</th></tr></thead><tbody>` +
    (days.length ? days.map(d => {
      const sessionAvgs = S.map(s => avgOf(by[d][s]));
      const v = sessionAvgs.filter(x => x != null);
      const a = v.length ? v.reduce((p, c) => p + c, 0) / v.length : null;
      return `<tr><td>${d.slice(8)}/${d.slice(5, 7)}</td>${sessionAvgs.map(sv => `<td class="v ${LS.band(sv, tg, wn)}">${LS.pct(sv)}</td>`).join('')}<td class="v ${LS.band(a, tg, wn)}">${LS.pct(a)}</td></tr>`;
    }).join('') : `<tr><td colspan="5" class="muted">–</td></tr>`) + '</tbody>';
}

boot();
</script>
</body>
</html>
